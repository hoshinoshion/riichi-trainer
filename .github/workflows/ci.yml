name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      # Seeded, so the same code always prints the same table; this only checks the AI plays games to the end.
      - name: AI simulation smoke run
        run: node tools/sim.js 6 easy,normal,hard east

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke
